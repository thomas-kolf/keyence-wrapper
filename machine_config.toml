# ============================================================
# MACHINE CONFIGURATION - KEYENCE WRAPPER
# ============================================================
#
# This file contains machine-specific settings for the Keyence wrapper.
#
# Important:
# - Change this file if the Keyence export/report structure changes.
# - Do NOT change Python code unless the processing logic itself changes.
# - Text after # is a comment and is ignored by the program.
# - Keep quotation marks around text values.
#
# ============================================================


# ============================================================
# 1. KEYENCE FILE AND FOLDER STRUCTURE
# ============================================================

[file_structure]

# Keyence recipe file extension.
# Example:
#   EMB_Gan_Prüfvorlage.zit
recipe_file_extension = ".zit"

# Keyence creates an output folder from the recipe name.
# Example:
#   Recipe file:   EMB_Gan_Prüfvorlage.zit
#   Output folder: EMB_Gan_Prüfvorlage_zit
recipe_output_suffix = "_zit"

# Date folders contain the normal measurement files.
# Example:
#   20260507
#
# Explanation for non-programmers:
#   ^      = start of the folder name
#   \\d{8} = exactly 8 digits
#   $      = end of the folder name
#
# So this only matches folders like:
#   20260507
#   20260409
date_folder_pattern = "^\\d{8}$"

# File pattern used to detect Keyence measurement groups.
# Example filename:
#   20260507_073049_001_VR-5200#7C020054.xlsx
#
# Explanation:
#   (?P<date>\\d{8}) = reads the first 8 digits as date
#   (?P<time>\\d{6}) = reads the next 6 digits as time
#
# From this filename:
#   20260507_073049_001_VR-5200#7C020054.xlsx
#
# The program extracts:
#   date = 20260507
#   time = 073049
#   group_key = 20260507_073049
group_file_pattern = "^(?P<date>\\d{8})_(?P<time>\\d{6})_.*"

# Name of the Keyence statistics folder.
# This folder contains the .zir files.
statistics_folder_name = "Statistics"


# ============================================================
# 2. KEYENCE EXCEL METADATA CELLS
# ============================================================

[excel_metadata]

# Cell where Keyence stores the timestamp.
timestamp_cell = "I16"

# Cell where Keyence stores the leadframe DMC / lot number.
# If DMC is missing here, the whole group becomes invalid.
dmc_cell = "I17"

# Cell where Keyence stores the raw position / running counter.
position_cell = "I18"

# Cell where Keyence stores the cell / measurement name.
name_cell = "I19"

# Product / recipe / part name from the Keyence report.
product_name_cell = "I20"

# Path information from the Keyence report.
path_cell = "I21"

# Processing information from the Keyence report.
processing_cell = "I23"

# Device name.
# Example:
#   VR-5200#7C020054
device_cell = "I24"

# Overall result from Keyence.
# Usually mapped to:
#   OK      -> IO
#   n.i.O.  -> NIO
overall_result_cell = "I25"


# ============================================================
# 3. KEYENCE MEASUREMENT TABLE SETTINGS
# ============================================================

[measurement_table]

# Row where the measurement table headers are located.
# Example: row with "Nr.", "Name der Messung", "Messergebnis", etc.
header_row = 31

# First row containing real measurement values.
start_row = 32

# First and last columns of the measurement table.
# Mostly documentation / boundary information.
first_column = "B"
last_column = "M"


# Column mapping for measurement extraction from Excel.
# These keys are the standardized JSON measurement fields.
# The values are Excel column letters.

[measurement_table.columns]

nr = "B"
measurement_name = "C"
elem_1 = "D"
detail = "E"
elem_2 = "F"
kommentar = "G"
classification = "H"
value = "I"
unit = "J"
target = "K"
upper_tolerance = "L"
lower_tolerance = "M"


# ============================================================
# 4. QUALITY MAPPING
# ============================================================

[quality_mapping]

# Keyence result text mapped to wrapper quality.
# Do not change the right side unless the wrapper naming should change.
ok_value = "OK"
ok_quality = "IO"

not_ok_value = "n.i.O."
not_ok_quality = "NIO"

unknown_quality = "UNKNOWN"


# ============================================================
# 5. RAW FILE EXPORT SETTINGS
# ============================================================

[raw_files]

# Normal raw files expected per measured cell.
# .zir is handled separately because it is stored in Statistics/YYYYMMDD.
normal_raw_suffixes = [
    ".xlsx",
    ".csv",
    ".zmr",
    "_h.png",
    "_t.png",
]

# Keyence statistics file extension.
statistics_suffix = ".zir"

# Character used to remove the serial number from the device name.
# Example:
#   VR-5200#7C020054 -> VR-5200
device_serial_separator = "#"

# Important:
# The .zir file can have a different hour in the filename.
# Example:
#   Normal file:     20260507_073049_001_VR-5200#7C020054.xlsx
#   Statistics file: 20260507_143049_001_VR-5200#7C020054.zir
#
# The date, minute+second, cell number and device still match.
allow_statistics_hour_difference = true


# ============================================================
# 6. EXPORT VERIFICATION
# ============================================================

[export_verification]

# Files that must exist in the standardized output package.
# If one of these is missing, the whole group fails export verification.
expected_output_suffixes = [
    ".json",
    ".xlsx",
    ".csv",
    ".zmr",
    ".zir",
    "_h.png",
    "_t.png",
    "_h_preview.png",
    "_t_preview.png",
    "_PowerBI.csv",
]


# ============================================================
# 7. IMAGE PREVIEW SETTINGS
# ============================================================

[preview]

# Enable or disable preview image generation.
#
# true  = create preview images
# false = skip preview image generation
#
# If this is set to false, export verification automatically
# does not require preview files anymore.
enabled = true

# Preview image size for Power BI / quick display.
preview_width = 160
preview_height = 120

# Source image suffixes for preview generation.
preview_source_suffixes = [
    "_h.png",
    "_t.png",
]


# ============================================================
# 8. IMAGE EMBEDDING INTO EXCEL REPORT
# ============================================================

[excel_image_embedding]

# Enable or disable embedding the original _h image into the copied Excel report.
enabled = true

# Image to embed into the Excel report.
# Usually the original height image.
source_image_suffix = "_h.png"

# Position inside the Excel sheet.
# Example:
#   E7 means column E, row 7.
anchor_cell = "E7"

# Embedded image size in Excel.
# These values are pixel-like openpyxl units.
image_width = 285
image_height = 300


# ============================================================
# 9. CSV / JSON MEASUREMENT VERIFICATION
# ============================================================

[measurement_verification]

# Encodings tried when reading Keyence CSV files.
# Do not remove entries unless you are sure all CSVs use one encoding.
csv_encodings = [
    "utf-8-sig",
    "cp1252",
    "latin1",
]

# CSV delimiter used by the Keyence CSV export.
# German/European CSV exports commonly use semicolon.
csv_delimiter = ";"

# Internal name for the first empty CSV header.
# Keyence has one empty column between Elem 1 and Elem 2.
empty_header_field_name = "detail"

# Decimal comma handling.
# Example:
#   -2,2 becomes -2.2
decimal_comma_to_dot = true

# Values treated as empty / no numeric value.
empty_numeric_values = [
    "",
    "-",
    "－",
]

# JSON fields that should be compared numerically.
# These values refer to the standardized JSON measurement keys.
numeric_fields = [
    "value",
    "target",
    "upper_tolerance",
    "lower_tolerance",
]


# Maps config alias groups to standardized JSON measurement fields.
# Left side  = alias group used below in header_aliases
# Right side = standardized JSON field in the wrapper artifact

[measurement_verification.field_mapping]

nr = "nr"
name_messung = "measurement_name"
elem_1 = "elem_1"
detail = "detail"
elem_2 = "elem_2"
beurteilung = "classification"
messergebnis = "value"
einheit = "unit"
sollwert = "target"
obere_toleranz = "upper_tolerance"
untere_toleranz = "lower_tolerance"
kommentar = "kommentar"


# Header names used to match CSV columns to JSON fields.
# If Keyence changes column names, adjust aliases here instead of Python code.
#
# Important:
# The verifier uses ONLY these aliases.
# So every real CSV header name must be listed here.
#
# The empty column between Elem 1 and Elem 2 is internally named "detail".

[measurement_verification.header_aliases]

nr = [
    "Nr.",
    "Nr",
    "Nummer",
]

name_messung = [
    "Name der Messung",
    "Name Messung",
    "Messung",
    "Merkmal",
]

elem_1 = [
    "Elem. 1",
    "Elem 1",
    "Element 1",
]

detail = [
    "detail",
]

elem_2 = [
    "Elem. 2",
    "Elem 2",
    "Element 2",
]

beurteilung = [
    "Beurteilung",
    "Bewertung",
]

messergebnis = [
    "Messergebnis",
    "Messwert",
    "Istwert",
]

einheit = [
    "Einheit",
    "Unit",
]

sollwert = [
    "Sollwert",
    "Nominalwert",
]

obere_toleranz = [
    "Obere Toleranz",
    "OT",
]

untere_toleranz = [
    "Untere Toleranz",
    "UT",
]

kommentar = [
    "Kommentar",
    "Comment",
]


# ============================================================
# 10. INPUT CLEANUP SETTINGS
# ============================================================

[input_cleanup]

# Delete processed normal input files after all verification checks passed.
delete_processed_files = true

# Never delete Statistics folders.
# This must stay true because original .zir files must remain untouched.
keep_statistics_folder = true

# Never delete .zit recipe files.
keep_recipe_files = true

# If a date folder only contains small leftover garbage files after processing,
# it can be deleted at the end of the pipeline.
max_leftover_folder_size_mb = 5

# Retry count for Windows folder deletion.
delete_retry_count = 15

# Wait time between retry attempts in seconds.
delete_retry_wait_seconds = 0.5


# ============================================================
# 11. MACHINE
# ============================================================

[machine]

# Machine name used for machine-specific configuration.
machine_name = "KeyenceVR5200"


# ============================================================
# 12. RUNTIME PATHS
# ============================================================

[runtime_paths]

# Root folder exposed by the Keyence VR-5200 machine.
#
# The wrapper processes this folder directly.
#
# Expected incoming structure:
# V:/
# ├── random machine files
# ├── EMB_Gan_Prüfvorlage.zit
# └── EMB_Gan_Prüfvorlage_zit/
#     ├── YYYYMMDD/
#     └── Statistics/
#         └── YYYYMMDD/
input_dir = "V:/"

# Root folder for standardized product folders.
#
# This intentionally points to the same machine root.
#
# Example:
# Recipe file:
#   EMB_Gan_Prüfvorlage.zit
#
# Standardized output folder:
#   V:/EMB_Gan_Prüfvorlage_zit/
#
# Future recipe files automatically create their own matching folders.
standardized_output_root_dir = "V:/"

# Power BI detail CSV output folder.
#
# All *_PowerBI.csv files are moved here directly after successful checks.
powerbi_details_dir = "V:/Powerbi_Details"

# Log root folder.
#
# Logs are written into one daily subfolder:
# V:/Logs/YYYYMMDD/
logs_dir = "V:/Logs"


# ============================================================
# 13. POWER BI ANALYTICS OUTPUT RULES
# ============================================================

[powerbi_details_rules]

# Existing Emb_Gan workflow stays unchanged.
# Compatible Emb_Gan recipes should still go to V:/Powerbi_Details.
"EMB_Gan_Prüfvorlage_zit" = "V:/Powerbi_Details"

# Future products get their own analytical details folders.
"PCB_Recipe_zit" = "V:/Powerbi_Details_PCB"
"Other_Product_Recipe_zit" = "V:/Powerbi_Details_Other_Product"